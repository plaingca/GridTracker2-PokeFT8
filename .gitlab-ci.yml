variables:
  APT_CACHE_DIR: $CI_PROJECT_DIR/.cache/apt
  DL_SERVER_ADDRESS: ""
  DL_SERVER_USER: gitlab
  DL_SERVER_PASS: ""
  PACKAGE_REGISTRY_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APPNAME}/${VERSION}'
  PACKAGE_REGISTRY_URL_YML: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APPNAME}'

  # nothing in this file will be allowed to run automatically except for:
  # 1. merge requests // MR should validate linting at the least
  # 2. manual tagging // maybe not anymore with Electron
  # 3. committing to the default branch // this is the typical release behavior for Electron

include:
  - template: "Workflows/MergeRequest-Pipelines.gitlab-ci.yml"
  - template: "Security/Dependency-Scanning.gitlab-ci.yml"
  - template: "Security/Secret-Detection.gitlab-ci.yml"
  - template: "Security/SAST.gitlab-ci.yml"

stages:
  - test
  - build
  - upload
  - release
  - publish

win:build:
  stage: build
  tags:
    - win
  rules:
    - if: $CI_COMMIT_TAG =~ '/(v|test_|win_).*/'
  artifacts:
    reports:
      dotenv: build.env
    name: '$CI_COMMIT_REF_SLUG'
    paths:
      - '$CI_PROJECT_DIR/dist/*.*'
    when: on_success
  cache:
    paths:
      - .cache/
      - node_modules/
  before_script:
    - npm install
    - npm install yaml
  script:
    - $env:VERSION = node -e "console.log(require('./package.json').version)"
    - echo "VERSION=$env:VERSION" >> build.env
    - $env:APPNAME = node -e "console.log(require('./package.json').name)"
    - echo "APPNAME=$env:APPNAME" >> build.env
    - echo "$env:APPNAME-$env:VERSION"
    - npm run build:win
    - |
      $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | 
              Sort-Object FullName -Descending | 
              Select-Object -First 1 -ExpandProperty FullName
      if (-not $signtool) {
        Write-Error "SignTool.exe not found"
        exit 1
      }
      Write-Host "Using SignTool: $signtool"
      $dlibPath = "C:\GitLab-Runner\AzureDLL\Azure.CodeSigning.Dlib.dll"
      $metadataPath = "C:\GitLab-Runner\metadata.json"
      Write-Host "Signing executables with Azure Trusted Signing..."
      Get-ChildItem dist\*.exe | ForEach-Object {
        Write-Host "Signing: $($_.Name)"
        & $signtool sign /v /fd SHA256 /tr "http://timestamp.acs.microsoft.com" /td SHA256 /dlib $dlibPath /dmdf $metadataPath /d "GridTracker2" /du "https://gridtracker.org" $_.FullName
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to sign $($_.Name)"
          exit 1
        }
      }
      Write-Host "All files signed successfully"
    - del dist/*.exe.blockmap
    - node hash_win_yaml.js dist/latest.yml
    - dir dist

