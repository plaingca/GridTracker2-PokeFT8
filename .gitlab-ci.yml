mac:build:
  tags:
    - saas-macos-medium-m1
  stage: build
  variables:
    CSC_LINK: .secure_files/mac-signing-certificate.p12
  image: macos-14-xcode-15
  rules:
    - if: $CI_COMMIT_TAG =~ '/(v|test_|mac_).*/'
  artifacts:
    reports:
      dotenv: build.env
    name: '$CI_COMMIT_REF_SLUG'
    paths:
      - '$CI_PROJECT_DIR/dist/*.*'
    when: on_success
  cache:
    paths:
      - .cache/
      - node_modules/
  before_script:
    - npm install
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
  script:
    - export VERSION=$(node -e "console.log(require('./package.json').version)")
    - export CSC_LINK=.secure_files/mac-signing-certificate.p12
    - echo "VERSION=$VERSION" >> build.env
    - export APPNAME=$(node -e "console.log(require('./package.json').name)")
    - echo "APPNAME=$APPNAME" >> build.env
    - echo "${APPNAME}-${VERSION}"
    - npm run build:mac
    - ls dist


