upload-gtserv:
  image: fedora:40
  rules:
    - if: $CI_COMMIT_TAG =~ '/v.*/'
  needs:
    - job: win:build
      artifacts: true
    - job: win7:build
      artifacts: true
    - job: mac:build
      artifacts: true
    - job: lin:build
      artifacts: true
    - job: arm32:build
      artifacts: true
    - job: arm64:build
      artifacts: true
    - job: win:upload
      artifacts: true
    - job: win7:upload
      artifacts: true
    - job: mac:upload
      artifacts: true
    - job: lin:upload
      artifacts: true
    - job: arm:upload
      artifacts: true
  stage: release
  before_script:
    - dnf install curl-minimal ncurses openssh-clients which -y
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - chmod 700 .secure_files/gt_serv.key
    - mkdir -p ~/.ssh
    - touch ~/.ssh/known_hosts
    - eval $(ssh-agent)
    - ssh-add .secure_files/gt_serv.key
    - ssh-keyscan ${GT_SERV_ADDRESS} >> ~/.ssh/known_hosts
  script:
    - echo ${APPNAME}-${VERSION}
    - scp -r dist/GridTracker2* ${GT_SERV_USER}@${GT_SERV_ADDRESS}:~/gt2_download/
    - scp -r dist/*.yml ${GT_SERV_USER}@${GT_SERV_ADDRESS}:~/gt2_download/stage/
    - scp -r dist/win7/GridTracker2* ${GT_SERV_USER}@${GT_SERV_ADDRESS}:~/gt2_download/win7/
    - scp -r dist/win7/*.yml ${GT_SERV_USER}@${GT_SERV_ADDRESS}:~/gt2_download/win7/stage/


auto-release-main:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ '/v.*/'
  needs:
    - job: win:build
      artifacts: true
    - job: win7:build
      artifacts: true
    - job: mac:build
      artifacts: true
    - job: lin:build
      artifacts: true
    - job: arm32:build
      artifacts: true
    - job: arm64:build
      artifacts: true
    - job: win:upload
      artifacts: true
    - job: win7:upload
      artifacts: true
    - job: mac:upload
      artifacts: true
    - job: lin:upload
      artifacts: true
    - job: arm:upload
      artifacts: true
  stage: release
  release:
    tag_name: $CI_COMMIT_TAG
    name: Release $APPNAME $VERSION
    description: Created using the release-cli. $CI_COMMIT_TITLE
    ref: $CI_COMMIT_SHA
    assets:
