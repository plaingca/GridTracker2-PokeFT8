      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "./dist/${APPNAME}-${VERSION}-aarch64.pacman" "${PACKAGE_REGISTRY_URL}/${APPNAME}-${VERSION}-arm64.pacman"
