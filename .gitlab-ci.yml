          link_type: other
        - name: Linux $APPNAME $VERSION armv7l Latest
          url: ${PACKAGE_REGISTRY_URL}/latest-linux-arm.yml
          link_type: other
        - name: Linux $APPNAME $VERSION arm64 Latest
          url: ${PACKAGE_REGISTRY_URL}/latest-linux-arm64.yml
